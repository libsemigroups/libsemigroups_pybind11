name: Run tests (pip)
on:
  # This workflow is called by ci.yml and custom-branch.yml, which specify the
  # branch of libsemigroups to build against.
  workflow_call:
    inputs:
      libsemigroups-branch:
        description: "The branch (or tag) of libsemigroups to build against"
        required: true
        type: string
      libsemigroups-repo:
        description: "The GitHub repository (owner/name) to clone libsemigroups from"
        required: false
        type: string
        default: libsemigroups/libsemigroups
permissions:
  contents: read

jobs:
  run-tests:
    name: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macOS-latest]
        include:
          - os: ubuntu-latest
            compiler: g++
          - os: macOS-latest
            compiler: clang++
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    defaults:
      run:
        shell: bash -l {0}
    env:
      CXX: "ccache ${{ matrix.compiler }}"
      CXXFLAGS: "-O2 -g"
      UV_NO_SYNC: "1"
      LD_LIBRARY_PATH: "/usr/local/lib"
    steps:
      # Setup environment
      - uses: actions/checkout@v6
      - name: "Set up Python"
        uses: actions/setup-python@v6
        with:
          python-version-file: "pyproject.toml"

      # Build libsemigroups
      - name: "macOS only: Install libsemigroups dependencies . . ."
        if: ${{ matrix.os == 'macOS-latest' }}
        run: brew install autoconf automake libtool
      - name: "Setup ccache . . ."
        uses: Chocobo1/setup-ccache-action@v1
        with:
          update_packager_index: false
          install_ccache: true
      - name: "Install libsemigroups . . ."
        env:
          LIBSEMIGROUPS_BRANCH: ${{ inputs.libsemigroups-branch }}
          LIBSEMIGROUPS_REPO: ${{ inputs.libsemigroups-repo }}
        run: |
          git clone --depth 1 --branch "$LIBSEMIGROUPS_BRANCH" "https://github.com/$LIBSEMIGROUPS_REPO.git" libsemigroups
          cd libsemigroups
          ./autogen.sh && ./configure CXX="$CXX" CXXFLAGS="$CXXFLAGS" && sudo make install -j4
          ccache -s

      # requirements.txt is used by the downstream job in libsemigroups' CI,
      # and Dependabot can update its pins without checking they are
      # mutually compatible, so check that it can still be installed. This
      # uses a separate venv so the rest of this job is unaffected.
      - name: "Check requirements.txt can be installed . . ."
        run: |
          python -m venv "$RUNNER_TEMP/requirements-venv"
          "$RUNNER_TEMP/requirements-venv/bin/python" -m pip install -r requirements.txt

      # Build libsemigroups_pybind11
      - name: "Install libsemigroups_pybind11 . . ."
        run: pip install ".[test,docs]"

        # Run the tests
      - name: "Running tests . . ."
        run: pytest
      - name: "Running doc tests . . ."
        run: make doctest
