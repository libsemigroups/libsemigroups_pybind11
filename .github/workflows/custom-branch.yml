name: Run tests on custom libsemigroups branch
on:
  workflow_dispatch:
    inputs:
      branch:
        description: "The branch of libsemigroups to clone"
        required: true
        type: string
      fork:
        description: "The fork of libsemigroups to clone"
        required: false
        type: string
        default: libsemigroups/libsemigroups
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  run-tests:
    name: "${{ inputs.fork }}@${{ inputs.branch }}"
    uses: ./.github/workflows/tests.yml
    with:
      libsemigroups-branch: ${{ inputs.branch }}
      libsemigroups-repo: ${{ inputs.fork }}
